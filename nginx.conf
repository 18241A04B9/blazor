server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    types {
        text/html                             html htm shtml;
        text/css                              css;
        application/javascript                js;
        application/wasm                      wasm;
        application/json                      json;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/svg+xml                         svg;
    }
}